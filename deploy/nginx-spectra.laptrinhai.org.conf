# Cấu hình Nginx Virtual Host trên máy chủ đích (Host Server)
# File đặt tại: /etc/nginx/sites-available/spectra.laptrinhai.org
# và symlink sang /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name spectra.laptrinhai.org;

    # Cho phép upload file âm thanh hô hấp dung lượng lớn (lên đến 25MB)
    client_max_body_size 25M;

    # Ghi log riêng biệt để dễ dàng theo dõi mà không lẫn vào website khác
    access_log /var/log/nginx/spectra_access.log;
    error_log /var/log/nginx/spectra_error.log;

    location / {
        # Trỏ vào port nội bộ mà Docker Frontend đang lắng nghe (mặc định 3008)
        proxy_pass http://127.0.0.1:3008;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout xử lý audio dài
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }
}
