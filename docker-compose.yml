version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rsdv-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - rsdv-data:/app/backend/storage
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rsdv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rsdv-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rsdv-network

volumes:
  rsdv-data:
    driver: local

networks:
  rsdv-network:
    driver: bridge
